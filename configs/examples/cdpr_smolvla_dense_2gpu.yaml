project:
  name: cdpr_smolvla_dense_2gpu
  output_root: ../../runs
  python_executable: python3

repos:
  dataset_repo: ../../robots/cdpr
  embodiment_repo: ../../robots/cdpr

remote:
  conda_env_file: null
  env_vars:
    MUJOCO_GL: egl
    PYOPENGL_PLATFORM: egl
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128
    TOKENIZERS_PARALLELISM: "false"
    RLVLA_CDPR_OFFSCREEN_SAMPLES: "1"
    RLVLA_CDPR_COMPILED_MODEL_CACHE: "true"
    RLVLA_CDPR_COMPILED_MODEL_CACHE_MAX_SIZE: "16"
    RLVLA_CDPR_QUIET: "true"
    RLVLA_CDPR_WRAPPER_LOG: "false"
  notes:
    - SmolVLA is loaded lazily from lerobot/smolvla_base through Hugging Face LeRobot.
    - This first run is online dense RL, not offline LeRobot dataset fine-tuning.
    - The pretrained SmolVLA prior is frozen; only the small Torch residual/readout head and critics are trained.
    - SmolVLA forward inference, image tensor preprocessing/resizing, residual actor, critics, and replay batches run on GPU.
    - MuJoCo simulation stepping and camera readback remain CPU-side.
    - Action chunks are continuous 5D CDPR commands normalized to [-1, 1].

assets:
  bundles:
    - name: ycb
      kind: asset
      source_path: ../../../../repo/CDPR-Dataset/cdpr_dataset/external_assets/ycb_dataset/ycb
      target_path: ../../assets/externals/ycb
      required: true
      description: YCB object meshes and MJCFs used by CDPR randomized scenes.
    - name: libero
      kind: asset
      source_path: ../../../../repo/LIBERO/libero/libero/assets
      target_path: ../../assets/externals/libero
      required: true
      description: LIBERO scene XMLs, textures, and scanned/stable object assets.
    - name: desk_textures_cache
      kind: asset
      source_path: ../../../../repo/CDPR-Dataset/cdpr_dataset/wrappers/_desk_textures
      target_path: ../../assets/externals/desk_textures_cache
      required: false
      description: Optional CDPR desk texture cache.

embodiment:
  name: cdpr_5dof
  kind: mujoco
  robot_root: ../../robots/cdpr/cdpr_mujoco
  xml_path: ../../robots/cdpr/cdpr_mujoco/cdpr.xml
  dof: 5
  extra_python_paths:
    - ../../robots/cdpr
  cameras:
    overview: overview
    wrist: ee_camera
  controller:
    file: ../../robots/cdpr/cdpr_mujoco/headless_cdpr_egl.py
    class_name: HeadlessCDPRSimulation
    init_kwargs:
      output_dir: "{run_dir}"
    method_map:
      initialize: initialize
      step: run_simulation_step
      cleanup: cleanup
      capture_frame: capture_frame
    frame_buffers:
      overview: overview_frames
      wrist: ee_camera_frames
    camera_handles:
      overview: overview_cam
      wrist: ee_cam
    preview_steps: 1
  action_adapter:
    common_action_keys: [x, y, z, yaw, gripper]
    controller_scales:
      x: 0.015
      y: 0.015
      z: 0.015
      yaw: 0.08
      gripper: 0.05
    controller_limits:
      x: [-0.8, 0.8]
      y: [-0.8, 0.8]
      z: [0.08, 1.2]
      yaw: [-3.141592653589793, 3.141592653589793]
      gripper: [0.0, 1.0]
    open_gripper_threshold: -0.2
    close_gripper_threshold: 0.2

task:
  instruction_types:
    [
      move_left,
      move_right,
      move_top,
      move_bottom,
      move_to_object,
      catch_object,
      grip_object,
      release_object,
      pick_up,
      put_into_plate,
      open_gripper,
      close_gripper,
      rotate_gripper_clockwise,
      rotate_gripper_counterclockwise,
    ]
  target_objects:
    [
      ycb_apple,
      ycb_banana,
      ycb_pear,
      ycb_peach,
      bowl,
      plate,
      ycb_baseball,
      ycb_lemon,
      ycb_fork,
      ycb_hammer,
      ycb_spoon,
    ]
  reward:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_reward
  success_predicate:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_validation_success
  metadata:
    zero_demo_first: true
    instruction_sampling: uniform_cycle
    reward_mode: dense
    target_object_pool:
      [
        ycb_apple,
        ycb_banana,
        ycb_pear,
        ycb_peach,
        bowl,
        plate,
        ycb_baseball,
        ycb_lemon,
        ycb_fork,
        ycb_hammer,
        ycb_spoon,
      ]
    distractor_object_pool:
      [
        ycb_apple,
        ycb_banana,
        ycb_pear,
        ycb_peach,
        bowl,
        plate,
        ycb_baseball,
        ycb_lemon,
        ycb_fork,
        ycb_hammer,
        ycb_spoon,
      ]
    scene_object_pool:
      [
        ycb_apple,
        ycb_banana,
        ycb_pear,
        ycb_peach,
        bowl,
        plate,
        ycb_baseball,
        ycb_lemon,
        ycb_fork,
        ycb_hammer,
        ycb_spoon,
      ]
    min_scene_objects: 1
    max_scene_objects: 3
    scene_variant_count: 128
    goal_center_xy: [0.0, 0.0]
    goal_height_above_table: 0.10
    lateral_goal_offset: 0.40
    vertical_goal_offset: 0.10
    distance_reward_scale: 0.40
    distance_reward_weight: 1.0
    distance_reward_exponent: 2.0
    success_distance: 0.02
    success_bonus: 0.0
    move_to_object_xy_reward_scale: 0.10
    move_to_object_distance_reward_weight: 1.0
    move_to_object_xy_tolerance: 0.025
    move_to_object_validation_distance_threshold: 0.025
    move_to_object_success_bonus: 1.0
    move_to_object_z_penalty_weight: 0.0
    direct_translation_reward_enabled: true
    direct_translation_success_displacement: 0.05
    direct_translation_orthogonal_tolerance: 0.05
    direct_translation_progress_weight: 1.0
    direct_translation_step_weight: 0.20
    direct_translation_step_scale: 0.0125
    direct_translation_wrong_step_penalty: 0.20
    direct_translation_action_weight: 0.0
    direct_translation_wrong_action_penalty: 0.15
    direct_translation_off_axis_action_penalty: 0.05
    direct_translation_orthogonal_drift_penalty: 0.0
    direct_control_success_bonus: 1.0
    direct_gripper_open_threshold: 0.80
    direct_gripper_closed_threshold: 0.20
    direct_gripper_progress_weight: 1.0
    direct_gripper_action_weight: 0.10
    direct_gripper_wrong_action_penalty: 0.10
    direct_actuator_translation_action_penalty: 0.20
    direct_actuator_success_bonus: 1.0
    direct_yaw_success_angle: 1.5707963267948966
    direct_yaw_start_angle: 0.0
    direct_yaw_progress_weight: 0.80
    direct_yaw_step_weight: 0.20
    direct_yaw_step_scale: 0.02
    direct_yaw_wrong_step_penalty: 0.20
    direct_yaw_action_weight: 0.10
    direct_yaw_wrong_action_penalty: 0.30
    gripper_edge_reward_scale: 0.015
    gripper_edge_reward_weight: 1.0
    gripper_edge_success_threshold: 0.010
    gripper_edge_success_bonus: 1.0
    release_success_edge_clearance: 0.035
    pick_lift_success_height: 0.05
    pick_grasp_xy_threshold: 0.04
    pick_gripper_closed_opening_threshold: 0.010
    pick_gripper_opening_reference: 0.028
    pick_approach_weight: 0.35
    pick_open_weight: 0.15
    pick_descend_weight: 0.20
    pick_grasp_weight: 0.40
    pick_lift_weight: 0.65
    pick_caught_target_bonus: 0.25
    manipulation_dense_reward_enabled: true
    manipulation_dense_error_scale: 0.08
    manipulation_dense_error_weight: 0.60
    manipulation_dense_motion_weight: 0.15
    manipulation_dense_grasp_weight: 0.10
    manipulation_dense_release_weight: 0.15
    manipulation_dense_success_bonus: 1.0
    sparse_success_reward: 1.0
    sparse_failure_reward: 0.0
    reward_output_normalization_enabled: true
    reward_output_normalization: clip
    reward_output_scale: 2.0
    reward_output_min: -1.0
    reward_output_max: 1.0
    target_at_gripper_start_instruction_types: [catch_object, grip_object]
    target_at_gripper_start_probability: 1.0
    target_at_gripper_start_gripper_opening: 1.0
    caught_object_start_instruction_types: [pick_up, put_into_plate]
    force_caught_object_start_instruction_types: [release_object]
    caught_object_start_probability: 1.0
    caught_object_start_object_offset: [0.0, 0.0, 0.005]
    caught_object_start_xy_jitter: 0.010
    caught_object_start_z_jitter: 0.004
    caught_object_start_fit_gripper: true
    caught_object_start_pin_object: false
    caught_object_start_gripper_clearance: 0.0
    caught_object_start_grip_compression: 0.001
    caught_object_start_min_height_above_table: 0.08
    caught_object_start_release_opening_threshold: 0.010
    caught_object_start_release_opening_margin: 0.04
    put_container_xy_tolerance: 0.08
    put_container_z_tolerance: 0.10
    put_require_release: true
    put_require_target_grasp: false
    action_saturation_threshold: 0.85
    action_saturation_penalty_weight: 0.0
    ee_workspace_x_bounds: [-0.28, 0.28]
    ee_workspace_y_bounds: [-0.28, 0.28]
    object_state_x_bounds: [-0.34, 0.34]
    object_state_y_bounds: [-0.34, 0.34]
    simulation_workspace_margin: 0.02
    simulation_qvel_limit: 50.0
    simulation_qacc_limit: 100000.0
    simulation_instability_penalty: -1.0
    object_spawn_x_bounds: [-0.22, 0.22]
    object_spawn_y_bounds: [-0.22, 0.22]
    object_spawn_center_xy: [0.0, 0.0]
    object_spawn_center_exclusion_radius: 0.14
    object_spawn_min_gap: 0.04
    object_spawn_min_ee_dist: 0.12
    object_spawn_max_tries: 300
    background_color_palette:
      [
        [0.16, 0.18, 0.21, 1.0],
        [0.20, 0.18, 0.16, 1.0],
        [0.17, 0.20, 0.18, 1.0],
        [0.22, 0.22, 0.24, 1.0],
        [0.14, 0.17, 0.20, 1.0],
        [0.21, 0.19, 0.22, 1.0],
      ]

simulation:
  entrypoint:
    file: ../../robots/cdpr/cdpr_dataset/generate_cdpr_dataset.py
    function: build_wrapper_if_needed
  preview_scene: desk
  preview_objects: [ycb_apple]
  catalog_path: ../../robots/cdpr/cdpr_dataset/datasets/cdpr_scene_catalog.yaml
  object_roots:
    - ../../assets/externals/ycb
    - ../../assets/externals/libero/stable_hope_objects
    - ../../assets/externals/libero/stable_scanned_objects
  desk_textures_dir: ../../assets/externals/desk_textures_cache
  desk_textures_fallback_dir: ../../assets/externals/libero/textures
  build_kwargs:
    scene_z: -0.85
    table_z: 0.15
    settle_time: 0.0
    ee_start: [0.0, 0.0, 0.40]
  randomization:
    random_scene_count: 100
    max_objects: 3
    use_domain_randomization: true

policy:
  type: smolvla_cdpr
  base_checkpoint: lerobot/smolvla_base
  rl_script: ../../rl_vla_bootstrapping/policy/smolvla_finetune_cdpr.py
  num_images_in_input: 3
  action_codec:
    chunk_size: 8
    normalized_low: -1.0
    normalized_high: 1.0
    quantization:
      enabled: false
      bins: 256
    export_filename: smolvla_action_codec.json

training:
  preview_before_rl: false
  rl:
    enabled: true
    algorithm: smolvla_residual_td3
    script_path: ../../rl_vla_bootstrapping/policy/smolvla_finetune_cdpr.py
    launcher: torchrun
    launcher_args:
      standalone: true
      nproc_per_node: 2
    args:
      max_train_steps: 1000000
      max_env_steps: 64
      num_envs_per_rank: 4
      chunk_size: 8
      replan_every: 4
      image_size: 256
      state_dim: 6
      include_wrist: true
      include_aux_camera: true
      mixed_precision: bf16
      smolvla_action_normalization: tanh
      hidden_dim: 1024
      residual_scale: 0.35
      actor_lr: 3.0e-4
      critic_lr: 3.0e-4
      gamma: 0.98
      tau: 0.01
      replay_size: 200000
      batch_size: 1024
      update_after: 2048
      updates_per_step: 2
      exploration_noise: 0.15
      min_exploration_noise: 0.03
      noise_decay_steps: 60000
      action_l2: 1.0e-3
      action_step_xyz: 0.015
      action_step_yaw: 0.08
      action_step_gripper: 0.05
      hold_steps: 6
      lock_non_commanded_axes: true
      lock_non_commanded_axes_threshold: 0.05
      randomize_ee_start: true
      ee_start_x_bounds: [-0.20, 0.20]
      ee_start_y_bounds: [-0.20, 0.20]
      ee_start_z: 0.40
      randomize_ee_yaw: true
      ee_yaw_bounds: [-3.141592653589793, 3.141592653589793]
      save_every_steps: 100000
      log_every_steps: 250
      status_every_steps: 500
      metrics_window_episodes: 100
      dense_stage_one_instruction_types:
        [
          move_left,
          move_right,
          move_top,
          move_bottom,
          open_gripper,
          close_gripper,
          rotate_gripper_clockwise,
          rotate_gripper_counterclockwise,
        ]
      dense_stage_two_instruction_types:
        [move_to_object, catch_object, grip_object, release_object, pick_up, put_into_plate]
      dense_stage_switch_success_rate: 0.80
      dense_stage_min_episodes: 80
      dense_stage_gate_metric: validation
      dense_stage_gate_aggregation: worst
      validation_every_steps: 50000
      validation_episodes_per_instruction: 10
      validation_seed: 1000000
      mixed_curriculum_enabled: true
      mixed_curriculum_adaptive: true
      mixed_curriculum_success_target: 0.80
      mixed_curriculum_history_episodes: 120
      mixed_curriculum_min_gap_weight: 0.05
      mixed_curriculum_min_prob: 0.03
      mixed_curriculum_max_prob: 0.35
      mixed_curriculum_rehearsal_min_prob: 0.30
      mixed_curriculum_move_to_object_min_prob: 0.25
      mixed_curriculum_manipulation_min_prob: 0.25
      near_success_instruction_types:
        [catch_object, grip_object, release_object, pick_up, put_into_plate]
      progress_refresh_seconds: 10.0
      progress: true
      progress_only: true
      distributed: true
      distributed_backend: nccl
      wrapper_cleanup: false
      use_wrapper_cache: true
      reuse_existing_wrapper_variants: true
      capture_frames: false
      device: cuda
  sft:
    enabled: false

evaluation:
  benchmarks: []
