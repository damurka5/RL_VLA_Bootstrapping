# Derived from the current Phase 7 config; see CDPR_NEXT_CAMPAIGN_PLAN.md.
project:
  name: cdpr_smolvla_release_recovery_pilot
  output_root: ../../runs
  python_executable: python3
repos:
  dataset_repo: ../../robots/cdpr
  embodiment_repo: ../../robots/cdpr
remote:
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128,garbage_collection_threshold:0.8
    TOKENIZERS_PARALLELISM: 'false'
    TRANSFORMERS_VERBOSITY: error
    HF_HUB_DISABLE_PROGRESS_BARS: '1'
    TORCH_NCCL_ASYNC_ERROR_HANDLING: '1'
    NCCL_DEBUG: WARN
  notes:
  - Bounded joint-RL pilot from step_2017690 under the corrected wrong_place_settled
    predicate. No SFT.
  - Fixed approach caps use one-rung ladders. Containers keep aligned uncaught desk
    starts and their existing spawn geometry; cap 0.20 is not a carry-distance curriculum.
  - All container training and evaluation starts are uncaught. Sparse reward and success
    geometry are unchanged from the current Phase 7 config.
  - Gripper episode-offset exploration is inherited from the current Phase 7 config,
    not added post-grasp globally. No pick-up-specific z exploration in this control
    pilot.
  - 500000 selected environment actions across both ranks, checked at update boundaries;
    this is a learning screen, not an expected convergence budget.
  - Keep baseline and all checkpoints; evaluate all four before continuing. In-run
    validation uses different seeds from the saved sil_record baseline and final comparison.
embodiment:
  name: cdpr_5dof_mjwarp
  kind: mjlab_mjwarp
  robot_root: ../../robots/cdpr/cdpr_mujoco
  xml_path: ../../robots/cdpr/cdpr_mujoco/cdpr_mjwarp_smoke.xml
  dof: 5
  extra_python_paths:
  - ../../robots/cdpr
  cameras:
    overview: overview
    wrist: ee_camera
  controller:
    file: ../../robots/cdpr/cdpr_mujoco/headless_cdpr_egl.py
    class_name: HeadlessCDPRSimulation
    init_kwargs: {}
    method_map:
      initialize: initialize
      step: run_simulation_step
      cleanup: cleanup
      capture_frame: capture_frame
    frame_buffers:
      overview: overview_frames
      wrist: ee_camera_frames
    camera_handles:
      overview: overview_cam
      wrist: ee_cam
    preview_steps: 1
  action_adapter:
    common_action_keys:
    - x
    - y
    - z
    - yaw
    - gripper
    controller_scales:
      x: 0.015
      y: 0.015
      z: 0.015
      yaw: 0.08
      gripper: 0.05
    controller_limits:
      x:
      - -0.8
      - 0.8
      y:
      - -0.8
      - 0.8
      z:
      - 0.08
      - 1.2
      yaw:
      - -3.141592653589793
      - 3.141592653589793
      gripper:
      - 0.0
      - 1.0
