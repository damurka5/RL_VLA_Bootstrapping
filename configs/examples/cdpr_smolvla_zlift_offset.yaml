simulation:
  entrypoint:
    file: ../../robots/cdpr/cdpr_dataset/generate_cdpr_dataset.py
    function: build_wrapper_if_needed
  preview_scene: desk
  preview_objects:
  - robocasa_apple
  - robocasa_plate
  - robocasa_bowl
  catalog_path: ../../robots/cdpr/cdpr_dataset/datasets/cdpr_scene_catalog.yaml
  build_kwargs:
    table_z: 0.15
    ee_start:
    - 0.0
    - 0.0
    - 0.4
  randomization:
    random_scene_count: 256
    max_objects: 4
    use_domain_randomization: true
simulator:
  backend: mjlab_mjwarp
  worlds_per_rank: 512
  groups_per_rank: 64
  nconmax: 256
  njmax: 1024
  render_width: 320
  render_height: 240
  object_slots: 4
  fixed_scene_xml: ../../robots/cdpr/cdpr_mujoco/cdpr_mjwarp_smoke.xml
policy:
  type: smolvla_cdpr
  base_checkpoint: lerobot/smolvla_base
  rl_script: ../../rl_vla_bootstrapping/policy/smolvla_grpo_mjwarp_cdpr.py
  num_images_in_input: 3
  action_codec:
    chunk_size: 8
    normalized_low: -1.0
    normalized_high: 1.0
    quantization:
      enabled: false
      bins: 256
    export_filename: smolvla_action_codec.json
training:
  preview_before_rl: false
  rl:
    enabled: true
    algorithm: smolvla_residual_grpo_mjwarp
    script_path: ../../rl_vla_bootstrapping/policy/smolvla_grpo_mjwarp_cdpr.py
    launcher: torchrun
    launcher_args:
      standalone: true
      nproc_per_node: 2
    args:
      max_train_steps: 500000
      max_env_steps: 128
      controller_workspace_z_bounds:
      - 0.18
      - 0.6
      chunk_size: 8
      replan_every: 4
      image_size: 256
      smolvla_model_image_size: 256
      smolvla_compile_model: true
      smolvla_compile_mode: max-autotune-no-cudagraphs
      smolvla_inference_microbatch_size: 256
      state_dim: 6
      residual_relative_target: false
      residual_vision_features: true
      residual_vision_dim: 512
      train_vla_lora: true
      lora_rank: 16
      lora_alpha: 32.0
      lora_dropout: 0.0
      lora_include_mlp: true
      lora_expert_name_contains: lm_expert
      train_vla_vision_lora: false
      lora_vision_name_contains: vision
      lora_vision_leaf_names: q_proj,k_proj,v_proj,out_proj,fc1,fc2
      vla_lr: 1.0e-05
      vla_kl_coef: 0.1
      vla_microbatch_size: 16
      vla_update_max_records: 128
      include_wrist: true
      include_aux_camera: true
      mask_empty_aux_camera: true
      mixed_precision: bf16
      smolvla_action_normalization: tanh
      hidden_dim: 1024
      residual_scale: 1.0
      learning_rate: 0.0001
      adam_eps: 1.0e-05
      weight_decay: 0.0
      init_log_std: -1.2
      min_log_std: -1.72
      max_log_std: -1.1
      clip_range_low: 0.2
      clip_range_high: 0.28
      # Sustained post-grasp z bias, the one channel the lift needs and the
      # only one never given an episode offset. Measured on the bowl_peak
      # checkpoint: pick_up commands mean a_z +0.232 while holding (p10 -0.020)
      # and lifts a median 0.0334 m against a 0.05 m threshold, while
      # put_into_plate commands +0.371 and lifts 0.0676. §4.2 puts the loaded
      # plant's ineffective->reliable transition at a_z 0.20-0.30, so pick_up's
      # median sits INSIDE that band and the containers clear it -- which is
      # exactly the ordering of their lift|grasp rates (0.2584 against 0.6747).
      #
      # 0.10 rather than the gripper's 0.15. At action_step_xyz 0.015 a 0.10
      # offset is 1.5 mm of commanded bias per step, and the lift needs the mean
      # held above the dead zone for ~13 consecutive steps -- about 2 cm, against
      # a measured shortfall of 1.66 cm. The +1 sigma candidate lands on the
      # requirement rather than past it, and 0.15 is the value with a recorded
      # cost: it stalled the curriculum and collapsed entropy when the gripper
      # channel carried it.
      episode_offset_std:
      - 0.0
      - 0.0
      - 0.10
      - 0.0
      - 0.15
      entropy_coef: 0.0002
      max_grad_norm: 1.0
      grpo_group_size: 8
      grpo_group_selection: uniform
      grpo_normalize_group_advantage: true
      grpo_clip_advantage_abs: 6.0
      grpo_min_group_reward_std: 0.05
      grpo_trajectory_groups: true
      grpo_dynamic_sampling: true
      grpo_dynamic_min_pass_rate: 0.1
      grpo_dynamic_max_pass_rate: 0.9
      grpo_target_records_per_update: 1024
      grpo_max_groups_per_update: 256
      grpo_target_informative_groups: 64
      grpo_max_collection_seconds_per_update: 600
      ppo_epochs: 4
      minibatch_size: 512
      microbatch_size: 512
      complex_training_approach: none
      action_step_xyz: 0.015
      action_step_yaw: 0.08
      action_step_gripper: 0.05
      hold_steps: 6
      lock_non_commanded_axes: false
      lock_non_commanded_axes_threshold: 0.05
      validation_every_steps: 100000
      validation_episodes_per_instruction: 256
      composed_validation_episodes_per_instruction: 128
      validation_seed: 2000000
      validation_video_count: 0
      save_every_steps: 100000
      mjwarp_profile_timers: true
      mjwarp_profile_updates: 4
      distributed: true
      distributed_backend: nccl
      distributed_timeout_seconds: 21600
      progress: true
      progress_only: true
      device: cuda
      # Gate the offset on holding, so it cannot perturb the approach or the
      # descent. That matters beyond tidiness: bowl's binding constraint is its
      # grasp (0.6003, and 54% of its failures never grasp), and its lift is
      # already fine (lift|grasp 0.6334). The gate leaves bowl's grasp
      # untouched and spends the exploration only where the deficit is.
      episode_offset_after_grasp: true
      split_credit_at_grasp: false
  sft:
    enabled: false
evaluation:
  benchmarks: []
