    - robocasa_bowl
    distractor_object_pool:
    - robocasa_apple
    - robocasa_banana
    - robocasa_tomato
    - robocasa_orange
    - robocasa_potato
    - robocasa_mug
    - robocasa_plate
    - robocasa_bowl
