project:
  name: cdpr_smolvla_catch_release_dense_grpo_mjlab_resume
  output_root: ../../runs
  python_executable: python3

repos:
  dataset_repo: ../../robots/cdpr
  embodiment_repo: ../../robots/cdpr

remote:
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128,garbage_collection_threshold:0.8
    TOKENIZERS_PARALLELISM: "false"
    TRANSFORMERS_VERBOSITY: error
    HF_HUB_DISABLE_PROGRESS_BARS: "1"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_DEBUG: WARN
  notes:
    - Phase 2 of the manipulation curriculum. Warm-start WEIGHTS-ONLY from the phase-1 pick_up adapter, not from move-to directly.
    - pick_up is kept in the mix as rehearsal so the grasp learned in phase 1 is not forgotten while placement is added.
    - Plain GRPO only; Reverse Frontier shells and LC-HOL are disabled, and the new phase is started in a fresh torchrun process.
    - Only catchable objects seen by the move-to checkpoint are language targets; plate and bowl are receptacles/distractors.
    - Plate/bowl episodes start with the named object physically caught between the fingers; pick_up episodes start with it on the desk.
    - Placement failures terminate as soon as the released/lost object settles outside the requested receptacle radius.
    - Each instruction runs its OWN success-gated approach curriculum, so placement successes cannot widen pick_up's start distance.
    - All three instructions share one dense shaping curve (coarse 0.08 + fine 0.01); the shaping window is decoupled from the success radius.
    - Every policy/LoRA/vision-residual setting matches phase 1 exactly; a mismatch makes the warm-start weights fail to load.

embodiment:
  name: cdpr_5dof_mjwarp
  kind: mjlab_mjwarp
  robot_root: ../../robots/cdpr/cdpr_mujoco
  xml_path: ../../robots/cdpr/cdpr_mujoco/cdpr_mjwarp_smoke.xml
  dof: 5
  extra_python_paths: [../../robots/cdpr]
  cameras:
    overview: overview
    wrist: ee_camera
  controller:
    file: ../../robots/cdpr/cdpr_mujoco/headless_cdpr_egl.py
    class_name: HeadlessCDPRSimulation
    init_kwargs: {}
    method_map:
      initialize: initialize
      step: run_simulation_step
      cleanup: cleanup
      capture_frame: capture_frame
    frame_buffers:
      overview: overview_frames
      wrist: ee_camera_frames
    camera_handles:
      overview: overview_cam
      wrist: ee_cam
    preview_steps: 1
  action_adapter:
    common_action_keys: [x, y, z, yaw, gripper]
    controller_scales:
      x: 0.015
      y: 0.015
      z: 0.015
      yaw: 0.08
      gripper: 0.05
    controller_limits:
      x: [-0.8, 0.8]
      y: [-0.8, 0.8]
      z: [0.08, 1.2]
      yaw: [-3.141592653589793, 3.141592653589793]
      gripper: [0.0, 1.0]

task:
  instruction_types: [put_into_plate, put_into_bowl, pick_up]
  target_objects:
    [
      robocasa_apple,
      robocasa_banana,
      robocasa_tomato,
      robocasa_orange,
      robocasa_potato,
      robocasa_mug,
      robocasa_plate,
      robocasa_bowl,
    ]
  reward:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_reward
  success_predicate:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_validation_success
  metadata:
    instruction_sampling: uniform_cycle
    reward_mode: dense
    target_object_pool:
      [
        robocasa_apple,
        robocasa_banana,
        robocasa_tomato,
        robocasa_orange,
        robocasa_potato,
        robocasa_mug,
      ]
    catchable_object_pool:
      [
        robocasa_apple,
        robocasa_banana,
        robocasa_tomato,
        robocasa_orange,
        robocasa_potato,
        robocasa_mug,
      ]
    container_object_pool: [robocasa_plate, robocasa_bowl]
    required_scene_object_pool: [robocasa_plate, robocasa_bowl]
    distractor_object_pool:
      [
        robocasa_apple,
        robocasa_banana,
        robocasa_tomato,
        robocasa_orange,
        robocasa_potato,
        robocasa_mug,
        robocasa_plate,
        robocasa_bowl,
      ]
    scene_object_pool:
      [
        robocasa_apple,
        robocasa_banana,
        robocasa_tomato,
        robocasa_orange,
        robocasa_potato,
        robocasa_mug,
        robocasa_plate,
        robocasa_bowl,
      ]
    # Placement forces 3 slots (target + plate + bowl) regardless of this range,
    # so min 1 only affects pick_up groups: they start distractor-free and pick
    # up extra objects at the curriculum steps. This matters because pick_up is
    # the task still being learned here -- move-to showed that distractors added
    # before the single-object task is mastered collapse the grounding.
    min_scene_objects: 1
    max_scene_objects: 3
    scene_object_curriculum_steps: [6000000, 9000000]

    # The new phase never uses the near-goal shell-0 spawn.
    random_workspace_gripper_start: true
    placement_start_with_caught_object: true
    ee_workspace_x_bounds: [-0.28, 0.28]
    ee_workspace_y_bounds: [-0.28, 0.28]
    # Narrowed from [0.30, 0.48]. The approach curriculum caps the start's XY
    # distance only, while the reward is 3-D: with a 0.18 m Z spread a "3 cm"
    # start was really up to ~0.18 m away, so the easy regime the curriculum
    # thinks it is creating did not exist. Plate hover sits at 0.285 m and bowl
    # hover at 0.356 m, so this band still requires a real descent.
    ee_workspace_z_bounds: [0.29, 0.40]
    random_workspace_min_goal_xy_distance: 0.10
    random_workspace_horizon_low: 24
    random_workspace_horizon_high: 32

    # --- Dense shaping: ONE curve for all three instructions ---------------
    # The placement term used to take its window from the SUCCESS radius (plate
    # 0.091, bowl 0.057). With scale 0.08 that made the plate reward >= 0.988
    # anywhere inside 10 cm: eight group candidates landing 3-6 cm apart scored
    # within ~0.003 of each other, and GRPO's group normalization divided that by
    # a near-zero std, turning rollout noise into full-magnitude advantages.
    # placement_distance_window decouples shaping from success -- success still
    # uses the real radius, shaping uses the same 0.02 window as pick_up.
    distance_reward_exponent: 2.0
    move_to_object_xy_reward_scale: 0.08
    move_to_object_distance_reward_weight: 1.0
    catch_release_distance_reward_scale: 0.08
    catch_release_distance_reward_weight: 1.0
    placement_distance_window: 0.02
    # Fine term: the coarse curve is already >= 0.94 two centimetres out, but a
    # grasp needs the pads within millimetres. Without this the last centimetre
    # of every approach carries no gradient at all.
    catch_release_fine_distance_reward_weight: 0.5
    catch_release_fine_distance_reward_scale: 0.01
    catch_release_fine_distance_window: 0.0
    # Bounded 3-D placement shaping toward a hover point above the receptacle.
    # XY-only shaping left the release height unconstrained while the frozen
    # prior pushes +Z, so the gripper drifted up and dropped from height.
    catch_release_distance_include_z: true
    put_plate_release_height: 0.045
    put_bowl_release_height: 0.10

    # Placement: distance is gripper-to-receptacle XY distance. Success also
    # requires release and the object center to fall within the real radius.
    put_plate_xy_tolerance: 0.091
    put_bowl_xy_tolerance: 0.057
    put_container_z_tolerance: 0.12
    placement_release_success_bonus: 2.0
    # Release is a risky action with a safe alternative: hovering over the
    # receptacle until timeout pays the shaping terms guaranteed (coarse 1.0 +
    # fine 0.5 = 1.5), while releasing pays 3.5 on success and (1.5 - penalty)
    # on a wrong drop. At penalty 1.0 releasing only beats hovering once the
    # success probability exceeds 33%, which the policy must first reach BY
    # releasing -- a chicken-and-egg local optimum. 0.25 drops that bar to
    # ~11% (1.25 + 2.25p > 1.5) while still deterring random drops: at p=0
    # releasing remains strictly worse than hovering. The fine term shifts both
    # sides equally, so the break-even is unchanged.
    placement_wrong_drop_penalty: 0.25
    # target_has_settled is measured from the DESK, but an object resting
    # correctly inside the bowl sits ~20.3 mm above it (bowl rest 0.0263, its
    # interior floor 6 mm below centre). At 0.025 that left only 4.7 mm of
    # slack, and falling outside it blocks BOTH success and the wrong-drop
    # termination, so the episode just times out silently. 0.045 gives ~25 mm.
    placement_wrong_drop_settle_margin: 0.045
    put_require_release: true
    put_require_target_grasp_history: true
    caught_object_start_release_opening_margin: 0.04

    # Pick-up: approach the physical between-fingers grasp point, reward a
    # persistent bilateral grasp, then reward lift only while grasp is kept.
    pick_grasp_height_offset: 0.08
    # Partial credit for bilateral pad contact: without it there is no gradient
    # between hovering at the grasp point and a latched persistent grasp.
    pick_contact_bonus: 0.25
    pick_distance_window: 0.02
    pick_grasp_bonus: 1.0
    pick_lift_reward_weight: 1.0
    pick_lift_reward_scale: 0.05
    pick_lift_success_height: 0.05
    pick_success_bonus: 2.0

    # --- Approach curriculum, run PER INSTRUCTION -------------------------
    # One cap per instruction, each gated on its own pass rate. A single shared
    # cap would be promoted by the placement tasks -- which start with the object
    # already in the gripper and only have to servo to a receptacle -- and would
    # drag pick_up out to far starts before it can grasp at all. Watch
    # curriculum/start_max_goal_distance_m/<instruction>: the placement caps
    # should climb quickly while pick_up's stays low until grasps appear.
    random_workspace_start_distance_curriculum_enabled: true
    # Bound the 3-D start distance, not just its XY projection: the placement
    # hover points sit 0.285 m (plate) and 0.356 m (bowl) up, so an XY-only cap
    # left the Z offset alone larger than the cap itself.
    curriculum_cap_includes_z: true
    random_workspace_start_distance_initial: 0.03
    random_workspace_start_distance_final: 0.34
    random_workspace_start_distance_increment: 0.02
    random_workspace_start_distance_promote_pass_rate: 0.03
    random_workspace_start_distance_demote_pass_rate: 0.01
    random_workspace_start_distance_pass_rate_ema_decay: 0.9
    random_workspace_start_distance_cooldown_updates: 5
    # Horizon coupled to each group's own cap. 16 at the initial cap: placement
    # must reach the hover point, open the gripper past the release threshold
    # (up to 0.215 of opening for the banana at 0.05 per env step), and let the
    # object fall and settle before the episode can be scored.
    curriculum_horizon_coupling_enabled: true
    curriculum_horizon_min: 16
    curriculum_horizon_max: 32
    reset_on_drift_enabled: false

simulation:
  entrypoint:
    file: ../../robots/cdpr/cdpr_dataset/generate_cdpr_dataset.py
    function: build_wrapper_if_needed
  preview_scene: desk
  preview_objects: [robocasa_apple, robocasa_plate, robocasa_bowl]
  catalog_path: ../../robots/cdpr/cdpr_dataset/datasets/cdpr_scene_catalog.yaml
  build_kwargs:
    table_z: 0.15
    ee_start: [0.0, 0.0, 0.40]
  randomization:
    random_scene_count: 256
    max_objects: 4
    use_domain_randomization: true

simulator:
  backend: mjlab_mjwarp
  worlds_per_rank: 512
  groups_per_rank: 64
  nconmax: 256
  njmax: 1024
  render_width: 320
  render_height: 240
  object_slots: 4
  fixed_scene_xml: ../../robots/cdpr/cdpr_mujoco/cdpr_mjwarp_smoke.xml

policy:
  type: smolvla_cdpr
  base_checkpoint: lerobot/smolvla_base
  rl_script: ../../rl_vla_bootstrapping/policy/smolvla_grpo_mjwarp_cdpr.py
  num_images_in_input: 3
  action_codec:
    chunk_size: 8
    normalized_low: -1.0
    normalized_high: 1.0
    quantization:
      enabled: false
      bins: 256
    export_filename: smolvla_action_codec.json

training:
  preview_before_rl: false
  rl:
    enabled: true
    algorithm: smolvla_residual_grpo_mjwarp
    script_path: ../../rl_vla_bootstrapping/policy/smolvla_grpo_mjwarp_cdpr.py
    launcher: torchrun
    launcher_args:
      standalone: true
      nproc_per_node: 2
    args:
      # No resume_checkpoint. The launcher passes the phase-1 pick_up adapter
      # through RLVLA_SMOLVLA_WARMSTART_CHECKPOINT instead: a full resume would
      # also restore phase 1's per-instruction curriculum caps and optimizer
      # moments, and phase 1 never trained the placement instructions, so their
      # caps would be meaningless here.
      max_train_steps: 15000000
      max_env_steps: 128
      chunk_size: 8
      replan_every: 4
      image_size: 256
      smolvla_model_image_size: 256
      smolvla_compile_model: true
      smolvla_compile_mode: max-autotune-no-cudagraphs
      smolvla_inference_microbatch_size: 256
      state_dim: 6
      # Must match the move-to phase: no privileged target geometry in the
      # observation, so the frozen SmolVLA's state is 6-dim pure proprioception.
      # The policy localizes the receptacle and the held object from the cameras,
      # exactly as at real-robot deployment.
      residual_relative_target: false
      # MUST MATCH the warm-start checkpoint. The trainable residual's input is
      # state_dim + vision_feature_dim, so omitting these builds a 6-wide
      # residual where the checkpoint holds a 518-wide one and the strict
      # load_state_dict fails outright. (Even if it loaded, dropping the frozen
      # connector-token projection would throw away the only part of the
      # observation that actually localizes the target.)
      residual_vision_features: true
      residual_vision_dim: 512
      # Must match the move-to phase: the checkpoint carries action-expert LoRA
      # weights, and loading refuses to drop them.
      train_vla_lora: true
      lora_rank: 16
      lora_alpha: 32.0
      lora_dropout: 0.0
      lora_include_mlp: true
      lora_expert_name_contains: lm_expert
      vla_lr: 1.0e-5
      vla_kl_coef: 0.1
      vla_microbatch_size: 16
      vla_update_max_records: 128
      include_wrist: true
      include_aux_camera: true
      mask_empty_aux_camera: true
      mixed_precision: bf16
      smolvla_action_normalization: tanh
      hidden_dim: 1024
      # Must match the move-to phase: the residual was trained at 1.0 so the
      # frozen prior's task-blind biases can be overridden per axis.
      residual_scale: 1.0
      learning_rate: 1.0e-4
      adam_eps: 1.0e-5
      weight_decay: 0.0
      init_log_std: -1.2
      min_log_std: -5.0
      # -0.3, not 0.5. At 0.5 (std ~1.65) the move-to action distribution
      # diffused instead of converging: with no directional reward signal the
      # entropy bonus dominated, log_std climbed from -1.2 upward, and the policy
      # collapsed to target-independent homing. This phase inherits that fix.
      max_log_std: -0.3
      clip_range_low: 0.20
      clip_range_high: 0.28
      # 0.0005, not 0.002, for the same reason; the per-instruction approach
      # curriculum now supplies the directional signal the entropy bonus was
      # being asked to find by diffusing.
      entropy_coef: 0.0005
      max_grad_norm: 1.0
      grpo_group_size: 8
      grpo_group_selection: uniform
      grpo_normalize_group_advantage: true
      grpo_clip_advantage_abs: 6.0
      grpo_trajectory_groups: true
      grpo_dynamic_sampling: true
      grpo_dynamic_min_pass_rate: 0.10
      grpo_dynamic_max_pass_rate: 0.90
      grpo_target_records_per_update: 1024
      grpo_max_groups_per_update: 64
      grpo_max_collection_seconds_per_update: 600
      ppo_epochs: 4
      minibatch_size: 512
      microbatch_size: 512
      complex_training_approach: none
      action_step_xyz: 0.015
      action_step_yaw: 0.08
      action_step_gripper: 0.05
      hold_steps: 6
      lock_non_commanded_axes: false
      lock_non_commanded_axes_threshold: 0.05
      validation_every_steps: 250000
      validation_episodes_per_instruction: 256
      validation_seed: 2000000
      validation_video_count: 0
      save_every_steps: 250000
      mjwarp_profile_timers: true
      mjwarp_profile_updates: 4
      distributed: true
      distributed_backend: nccl
      distributed_timeout_seconds: 21600
      progress: true
      progress_only: true
      device: cuda
  sft:
    enabled: false

evaluation:
  benchmarks: []
