project:
  name: cdpr_smolvla_move_to_distance_grpo_mjlab_scratch
  output_root: ../../runs
  python_executable: python3

repos:
  dataset_repo: ../../robots/cdpr
  embodiment_repo: ../../robots/cdpr

remote:
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128,garbage_collection_threshold:0.8
    TOKENIZERS_PARALLELISM: "false"
    TRANSFORMERS_VERBOSITY: error
    HF_HUB_DISABLE_PROGRESS_BARS: "1"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_DEBUG: WARN
  notes:
    - Fresh GRPO residual/readout initialization at global step zero; no adapter checkpoint is loaded.
    - One torchrun rank owns one A40, a frozen SmolVLA replica, and complete rank-local GRPO groups.
    - Only move_to_object is sampled; prompts use semantic object labels without RoboCasa variant numbers.
    - Every GRPO group starts the gripper at a seeded random XY workspace position at Z=0.22 m, at least 0.12 m from its target; Reverse Frontier shells are disabled.
    - The GPU reward is one bounded inverse-polynomial term on the 3-D distance to the hover point (target XY at Z=0.22 m), so its magnitude stays in [0, 1] and conditions the GRPO group advantage.
    - Objects are drawn from a 3x3 candidate grid and the move-to target is a random active slot, so the goal is not pinned to one location.
    - Scenes start with a single object and add a second and third scene object at the configured curriculum steps; the fourth MJWarp slot is never used.
    - SmolVLA camera slot three is a masked empty camera (zeroed image plus padding mask) instead of a duplicated wrist view.
    - Rank zero writes TensorBoard metrics; every 200k selected actions both ranks evaluate fixed held-out GPU scenes balanced across all eight objects and save the same policy checkpoint.

embodiment:
  name: cdpr_5dof_mjwarp
  kind: mjlab_mjwarp
  robot_root: ../../robots/cdpr/cdpr_mujoco
  xml_path: ../../robots/cdpr/cdpr_mujoco/cdpr_mjwarp_smoke.xml
  dof: 5
  extra_python_paths: [../../robots/cdpr]
  cameras:
    overview: overview
    wrist: ee_camera
  controller:
    file: ../../robots/cdpr/cdpr_mujoco/headless_cdpr_egl.py
    class_name: HeadlessCDPRSimulation
    init_kwargs: {}
    method_map:
      initialize: initialize
      step: run_simulation_step
      cleanup: cleanup
      capture_frame: capture_frame
    frame_buffers:
      overview: overview_frames
      wrist: ee_camera_frames
    camera_handles:
      overview: overview_cam
      wrist: ee_cam
    preview_steps: 1
  action_adapter:
    common_action_keys: [x, y, z, yaw, gripper]
    controller_scales:
      x: 0.015
      y: 0.015
      z: 0.015
      yaw: 0.08
      gripper: 0.05
    controller_limits:
      x: [-0.8, 0.8]
      y: [-0.8, 0.8]
      z: [0.08, 1.2]
      yaw: [-3.141592653589793, 3.141592653589793]
      gripper: [0.0, 1.0]

task:
  instruction_types: [move_to_object]
  target_objects:
    [
      robocasa_apple,
      robocasa_banana,
      robocasa_tomato,
      robocasa_orange,
      robocasa_potato,
      robocasa_mug,
      robocasa_plate,
      robocasa_bowl,
    ]
  reward:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_reward
  success_predicate:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_validation_success
  metadata:
    instruction_sampling: uniform_cycle
    reward_mode: dense
    target_object_pool:
      [
        robocasa_apple,
        robocasa_banana,
        robocasa_tomato,
        robocasa_orange,
        robocasa_potato,
        robocasa_mug,
        robocasa_plate,
        robocasa_bowl,
      ]
    distractor_object_pool:
      [
        robocasa_apple,
        robocasa_banana,
        robocasa_tomato,
        robocasa_orange,
        robocasa_potato,
        robocasa_mug,
        robocasa_plate,
        robocasa_bowl,
      ]
    scene_object_pool:
      [
        robocasa_apple,
        robocasa_banana,
        robocasa_tomato,
        robocasa_orange,
        robocasa_potato,
        robocasa_mug,
        robocasa_plate,
        robocasa_bowl,
      ]
    # Object-count curriculum: 1 object until the first threshold, then up to
    # 2, then up to 3 (sampled uniformly per group). Slot four stays inactive.
    min_scene_objects: 1
    max_scene_objects: 3
    scene_object_curriculum_steps: [1500000, 3000000]
    distance_reward_exponent: 2.0
    success_distance: 0.02
    success_bonus: 0.0
    move_to_object_xy_reward_scale: 0.08
    move_to_object_distance_reward_weight: 1.0
    move_to_object_xy_tolerance: 0.02
    move_to_object_xy_window_low: 0.0
    move_to_object_xy_window_high: 0.02
    move_to_object_excess_distance_penalty_weight: 0.0
    move_to_object_too_close_penalty_weight: 0.0
    move_to_object_success_bonus: 0.0
    # A 2 cm Z band with a bounded-magnitude slope: the previous 1 cm band at
    # weight 1.0 / scale 0.03 produced penalties of 1-2 that drowned the 0-1 XY
    # distance term in every group advantage and stalled XY learning.
    move_to_object_require_z_window: true
    move_to_object_z_window_low: 0.21
    move_to_object_z_window_high: 0.23
    # Bounded 3-D shaping: a single inverse-polynomial term on the distance to
    # the hover point (target XY, approach_z) replaces the XY term + linear
    # Z-band penalty. Magnitude stays in [0, weight], which conditions the GRPO
    # group-relative advantage far better. The z_penalty_* keys below are the
    # inactive legacy fallback (used only when distance_include_z is false).
    move_to_object_distance_include_z: true
    move_to_object_approach_z: 0.22
    move_to_object_z_penalty_scale: 0.05
    move_to_object_z_penalty_weight: 0.5
    action_saturation_penalty_weight: 0.0
    move_to_object_validation_distance_min: 0.0
    move_to_object_validation_distance_threshold: 0.02
    random_workspace_gripper_start: true
    random_workspace_min_goal_xy_distance: 0.12
    random_workspace_horizon_low: 32
    random_workspace_horizon_high: 32
    ee_workspace_x_bounds: [-0.24, 0.24]
    ee_workspace_y_bounds: [-0.24, 0.24]
    # Desk top is world Z=0.15 m and object centres sit near 0.19 m, so
    # 0.22 m hovers ~3 cm above the object centre. The success Z window
    # above is recentred on the same height.
    ee_workspace_z_bounds: [0.22, 0.22]

simulation:
  entrypoint:
    file: ../../robots/cdpr/cdpr_dataset/generate_cdpr_dataset.py
    function: build_wrapper_if_needed
  preview_scene: desk
  preview_objects: [robocasa_apple, robocasa_plate, robocasa_bowl]
  catalog_path: ../../robots/cdpr/cdpr_dataset/datasets/cdpr_scene_catalog.yaml
  build_kwargs:
    table_z: 0.15
    ee_start: [0.0, 0.0, 0.40]
  randomization:
    random_scene_count: 256
    max_objects: 4
    use_domain_randomization: true

simulator:
  backend: mjlab_mjwarp
  worlds_per_rank: 512
  groups_per_rank: 64
  nconmax: 256
  njmax: 1024
  render_width: 320
  render_height: 240
  object_slots: 4
  fixed_scene_xml: ../../robots/cdpr/cdpr_mujoco/cdpr_mjwarp_smoke.xml

policy:
  type: smolvla_cdpr
  base_checkpoint: lerobot/smolvla_base
  rl_script: ../../rl_vla_bootstrapping/policy/smolvla_grpo_mjwarp_cdpr.py
  num_images_in_input: 3
  action_codec:
    chunk_size: 8
    normalized_low: -1.0
    normalized_high: 1.0
    quantization:
      enabled: false
      bins: 256
    export_filename: smolvla_action_codec.json

training:
  preview_before_rl: false
  rl:
    enabled: true
    algorithm: smolvla_residual_grpo_mjwarp
    script_path: ../../rl_vla_bootstrapping/policy/smolvla_grpo_mjwarp_cdpr.py
    launcher: torchrun
    launcher_args:
      standalone: true
      nproc_per_node: 2
    args:
      max_train_steps: 5000000
      max_env_steps: 128
      chunk_size: 8
      replan_every: 4
      image_size: 256
      smolvla_model_image_size: 256
      smolvla_compile_model: true
      smolvla_compile_mode: max-autotune-no-cudagraphs
      smolvla_inference_microbatch_size: 512
      state_dim: 6
      # Widen ONLY the trainable residual's state with the 3-D EE->target
      # vector; the frozen SmolVLA replica still gets the truncated 6-dim state.
      residual_relative_target: true
      include_wrist: true
      include_aux_camera: true
      mask_empty_aux_camera: true
      mixed_precision: bf16
      smolvla_action_normalization: tanh
      hidden_dim: 1024
      # The frozen prior carries a task-blind +0.45 mean Z bias (see
      # scripts/diagnose_smolvla_prior_scale.py). At scale 0.30 the residual
      # cannot bring action_z <= 0, so the EE can never descend/hold and
      # move-to is impossible; 1.0 gives the residual full per-axis authority.
      residual_scale: 1.0
      # SmolVLA action-expert LoRA (off by default; flip train_vla_lora to true
      # to let RL gradients reach model.vlm_with_expert.lm_expert, vision + VLM
      # frozen). See SMOLVLA_LORA_FINETUNE_PLAN.md before enabling.
      train_vla_lora: true
      lora_rank: 16
      lora_alpha: 32.0
      lora_dropout: 0.0
      # attn+MLP: 3.42M trainable (attention-only would be 1.29M). Measured
      # cost vs no LoRA: -9.2% selected actions/s from the adapters running in
      # every rollout forward.
      lora_include_mlp: true
      lora_expert_name_contains: lm_expert
      vla_lr: 1.0e-5
      vla_kl_coef: 0.1
      # Measured peak VRAM on a ~46 GB A40 at 512 worlds (grad-through-VLA
      # backward ON): mb 16 -> 37.7 GB, 32 -> 41.1 GB, 64 -> 45.5 GB (~99% of
      # the card, unsafe), 128 -> OOM. Throughput is identical across all of
      # them because the LoRA update is negligible next to the 95 s SmolVLA
      # rollout, and every record is accumulated regardless of chunk size, so
      # the gradient is unchanged. 16 is therefore strictly dominant: it fits
      # under the rollout's existing allocator high-water mark (+0.3 GB).
      vla_microbatch_size: 16
      # Bounded by the microbatch, not by this, so raising it costs update
      # time (more chunks) rather than VRAM.
      vla_update_max_records: 128
      learning_rate: 1.0e-4
      adam_eps: 1.0e-5
      weight_decay: 0.0
      init_log_std: -1.2
      min_log_std: -5.0
      max_log_std: 0.5
      clip_range_low: 0.20
      clip_range_high: 0.28
      entropy_coef: 0.002
      max_grad_norm: 1.0
      grpo_group_size: 8
      grpo_group_selection: uniform
      grpo_normalize_group_advantage: true
      grpo_clip_advantage_abs: 6.0
      grpo_trajectory_groups: true
      grpo_dynamic_sampling: true
      grpo_dynamic_min_pass_rate: 0.10
      grpo_dynamic_max_pass_rate: 0.90
      grpo_target_records_per_update: 1024
      grpo_max_groups_per_update: 64
      grpo_max_collection_seconds_per_update: 600
      ppo_epochs: 4
      minibatch_size: 512
      microbatch_size: 512
      complex_training_approach: none
      action_step_xyz: 0.015
      action_step_yaw: 0.08
      action_step_gripper: 0.05
      hold_steps: 6
      lock_non_commanded_axes: false
      lock_non_commanded_axes_threshold: 0.05
      validation_every_steps: 200000
      validation_episodes_per_instruction: 1024
      validation_seed: 1000000
      validation_video_count: 0
      save_every_steps: 200000
      mjwarp_profile_timers: true
      mjwarp_profile_updates: 4
      distributed: true
      distributed_backend: nccl
      distributed_timeout_seconds: 21600
      progress: true
      progress_only: true
      device: cuda
  sft:
    enabled: false

evaluation:
  benchmarks: []
