project:
  name: cdpr_smolvla_complex_reverse_frontier_grpo
  output_root: ../../runs
  python_executable: python3

repos:
  dataset_repo: ../../robots/cdpr
  embodiment_repo: ../../robots/cdpr

remote:
  env_vars:
    MUJOCO_GL: egl
    PYOPENGL_PLATFORM: egl
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128
    TOKENIZERS_PARALLELISM: "false"
    RLVLA_CDPR_OFFSCREEN_SAMPLES: "1"
    RLVLA_CDPR_COMPILED_MODEL_CACHE: "true"
    RLVLA_CDPR_COMPILED_MODEL_CACHE_MAX_SIZE: "16"
    RLVLA_CDPR_QUIET: "true"
    RLVLA_CDPR_WRAPPER_LOG: "false"
  notes:
    - Reverse Frontier comparison run using exact sparse binary GRPO rewards.
    - Base shells represent 4-6, 7-10, 11-16, and 17-24 target policy decisions.
    - Plate and spatial-relation tasks add aligned-catch, approach-catch, and full-task shells.
    - Each instruction advances one shell only after at least 80 percent held-out success.

assets:
  bundles:
    - name: ycb
      source_path: ../../../../repo/CDPR-Dataset/cdpr_dataset/external_assets/ycb_dataset/ycb
      target_path: ../../assets/externals/ycb
      required: true
    - name: libero
      source_path: ../../../../repo/LIBERO/libero/libero/assets
      target_path: ../../assets/externals/libero
      required: true

embodiment:
  name: cdpr_5dof
  kind: mujoco
  robot_root: ../../robots/cdpr/cdpr_mujoco
  xml_path: ../../robots/cdpr/cdpr_mujoco/cdpr.xml
  dof: 5
  extra_python_paths: [../../robots/cdpr]
  cameras:
    overview: overview
    wrist: ee_camera
  controller:
    file: ../../robots/cdpr/cdpr_mujoco/headless_cdpr_egl.py
    class_name: HeadlessCDPRSimulation
    init_kwargs:
      output_dir: "{run_dir}"
    method_map:
      initialize: initialize
      step: run_simulation_step
      cleanup: cleanup
      capture_frame: capture_frame
    frame_buffers:
      overview: overview_frames
      wrist: ee_camera_frames
    camera_handles:
      overview: overview_cam
      wrist: ee_cam
    preview_steps: 1
  action_adapter:
    common_action_keys: [x, y, z, yaw, gripper]
    controller_scales:
      x: 0.015
      y: 0.015
      z: 0.015
      yaw: 0.08
      gripper: 0.05
    controller_limits:
      x: [-0.8, 0.8]
      y: [-0.8, 0.8]
      z: [0.08, 1.2]
      yaw: [-3.141592653589793, 3.141592653589793]
      gripper: [0.0, 1.0]

task:
  instruction_types:
    - move_to_object
    - push_left
    - push_right
    - put_into_bowl
    - put_into_plate
    - move_left_of_object
    - move_right_of_object
    - move_between_objects
  target_objects: [ycb_apple, ycb_pear, ycb_peach, ycb_b_cups, ycb_baseball, plate, bowl]
  reward:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_reward
  success_predicate:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_validation_success
  metadata:
    zero_demo_first: true
    instruction_sampling: uniform_cycle
    reward_mode: sparse_binary
    sparse_success_reward: 1.0
    sparse_failure_reward: 0.0
    reward_output_normalization_enabled: false
    manipulation_dense_reward_enabled: false
    simulation_instability_penalty: 0.0
    reverse_frontier_profile: smolvla_complex_v1
    # Horizons are policy decisions, not raw MuJoCo substeps. With hold_steps=6,
    # one decision still advances seven simulator steps internally.
    reverse_frontier_policy_decision_bounds:
      - [4, 6]
      - [7, 10]
      - [11, 16]
      - [17, 24]
      - [25, 52]
      - [53, 80]
      - [81, 128]
    # Effective Cartesian progress per decision as a fraction of action_step_xyz.
    # The imitation controller commands 0.60; cable dynamics realize about 0.44.
    reverse_frontier_nominal_progress_fraction: 0.44
    put_plate_language_use_on: true
    put_relation_language: true

    target_object_pool: [ycb_apple, ycb_pear, ycb_peach, ycb_b_cups, ycb_baseball]
    catchable_object_pool: [ycb_apple, ycb_pear, ycb_peach, ycb_b_cups, ycb_baseball]
    grippable_object_pool: [ycb_apple, ycb_pear, ycb_peach, ycb_b_cups, ycb_baseball]
    container_object_pool: [plate, bowl]
    required_scene_object_pool: [plate, bowl]
    distractor_object_pool: [ycb_apple, ycb_pear, ycb_peach, ycb_b_cups, ycb_baseball, plate, bowl]
    scene_object_pool: [ycb_apple, ycb_pear, ycb_peach, ycb_b_cups, ycb_baseball, plate, bowl]
    min_scene_objects: 4
    max_scene_objects: 4
    scene_variant_count: 256

    move_to_object_single_object_scene: false
    move_to_object_xy_tolerance: 0.02
    move_to_object_xy_window_low: 0.0
    move_to_object_xy_window_high: 0.02
    move_to_object_validation_distance_min: 0.0
    move_to_object_validation_distance_threshold: 0.02
    # Longer policy-defined shells accumulate small passive cable Z drift even
    # when the action keeps commanding the reset height.
    move_to_object_max_z_excursion: 0.03
    move_to_object_require_z_window: false

    push_surface_reward_enabled: false
    push_position_only_reward: true
    push_success_displacement: 0.08
    # A directional displacement is not enough: the object must finish near
    # the intended planar endpoint rather than drifting sideways or overshooting.
    push_enforce_orthogonal_tolerance: true
    push_orthogonal_tolerance: 0.02
    push_enforce_max_overshoot: true
    push_max_overshoot: 0.025
    push_require_object_on_support: true
    push_support_min_clearance: 0.005
    push_support_vertical_tolerance: 0.04

    target_at_gripper_start_instruction_types: []
    target_at_gripper_start_probability: 0.0
    caught_object_start_instruction_types:
      [put_into_bowl, put_into_plate, move_left_of_object, move_right_of_object, move_between_objects]
    force_caught_object_start_instruction_types: []
    caught_object_start_probability: 1.0
    caught_object_start_above_reference_instruction_types: [put_into_bowl, put_into_plate]
    caught_object_start_above_reference_height: 0.16
    caught_object_start_reference_xy_jitter: 0.010
    caught_object_start_object_offset: [0.0, 0.0, 0.005]
    caught_object_start_xy_jitter: 0.010
    caught_object_start_z_jitter: 0.004
    caught_object_start_fit_gripper: true
    caught_object_start_pin_object: true
    caught_object_start_gripper_clearance: 0.0
    caught_object_start_grip_compression: 0.001
    caught_object_start_min_height_above_table: 0.08
    caught_object_start_release_opening_threshold: 0.010
    caught_object_start_release_opening_margin: 0.04
    # Wide YCB objects are physically caught with a large normalized opening;
    # detect closure around the object, then require opening past its fitted
    # width before a released placement can succeed.
    catch_gripper_closed_opening_threshold: 0.94
    grasp_history_release_use_fitted_opening: true
    # Grasp-learning shells start with a free object. Once the policy has
    # centered the gripper and actively closed to the fitted object width,
    # engage the same stable carry constraint used by the held-object shells.
    # This remains disabled at reset, so approach and closing are still
    # required policy phases.
    reverse_frontier_dynamic_grasp_latch: true
    reverse_frontier_grasp_latch_xy_distance: 0.030
    reverse_frontier_grasp_latch_z_distance: 0.060
    reverse_frontier_grasp_latch_min_finger_contacts: 1
    reverse_frontier_grasp_latch_contactless_xy_distance: 0.028
    reverse_frontier_grasp_latch_contactless_z_distance: 0.030
    reverse_frontier_grasp_latch_opening_margin: 0.012
    reverse_frontier_grasp_latch_closing_command_threshold: 0.05

    # Require the target center to be visibly inside/on the receptacle. The Z
    # tolerance remains geometry-aware because bowl/plate body origins differ.
    put_container_xy_tolerance: 0.03
    put_container_z_tolerance: 0.12
    put_require_release: true
    put_release_opening_threshold: 0.55
    put_require_target_grasp: false
    put_require_target_grasp_history: true
    put_downward_reward_enabled: false
    put_min_target_motion: 0.04
    relation_left_right_offset: 0.10
    # Square zone side length: 0.03 means +/-1.5 cm on each planar axis.
    move_relation_success_zone_size: 0.03
    move_relation_min_target_motion: 0.04
    move_relation_require_target_grasp: false
    move_relation_require_target_grasp_history: true
    move_relation_require_release: true
    relation_min_target_motion: 0.04
    relation_require_target_grasp: false
    relation_require_target_grasp_history: true
    relation_require_release: true
    between_xy_tolerance: 0.03

    grab_require_caught: true
    grab_xy_tolerance: 0.025
    pick_lift_success_height: 0.05
    lchol_direction_displacement_threshold: 0.05
    lchol_near_reference_tolerance: 0.16
    action_saturation_penalty_weight: 0.0
    path_efficiency_penalty_weight: 0.0
    sign_flip_penalty_weight: 0.0
    action_delta_penalty_weight: 0.0
    action_jerk_penalty_weight: 0.0

    ee_workspace_x_bounds: [-0.28, 0.28]
    ee_workspace_y_bounds: [-0.28, 0.28]
    object_state_x_bounds: [-0.34, 0.34]
    object_state_y_bounds: [-0.34, 0.34]
    simulation_workspace_margin: 0.02
    simulation_qvel_limit: 50.0
    simulation_qacc_limit: 100000.0
    object_spawn_x_bounds: [-0.22, 0.22]
    object_spawn_y_bounds: [-0.22, 0.22]
    object_spawn_center_xy: [0.0, 0.0]
    object_spawn_center_exclusion_radius: 0.12
    object_spawn_min_gap: 0.04
    object_spawn_min_ee_dist: 0.12
    object_spawn_max_tries: 300

simulation:
  entrypoint:
    file: ../../robots/cdpr/cdpr_dataset/generate_cdpr_dataset.py
    function: build_wrapper_if_needed
  preview_scene: desk
  preview_objects: [ycb_apple, plate, bowl]
  catalog_path: ../../robots/cdpr/cdpr_dataset/datasets/cdpr_scene_catalog.yaml
  object_roots:
    - ../../assets/externals/ycb
    - ../../assets/externals/libero/stable_hope_objects
    - ../../assets/externals/libero/stable_scanned_objects
  desk_textures_dir: ../../assets/externals/desk_textures_cache
  desk_textures_fallback_dir: ../../assets/externals/libero/textures
  build_kwargs:
    scene_z: -0.85
    table_z: 0.15
    settle_time: 0.0
    ee_start: [0.0, 0.0, 0.40]
  randomization:
    random_scene_count: 100
    max_objects: 4
    use_domain_randomization: true

policy:
  type: smolvla_cdpr
  base_checkpoint: lerobot/smolvla_base
  rl_script: ../../rl_vla_bootstrapping/policy/smolvla_grpo_finetune_cdpr.py
  num_images_in_input: 3
  action_codec:
    chunk_size: 8
    normalized_low: -1.0
    normalized_high: 1.0
    quantization:
      enabled: false
      bins: 256
    export_filename: smolvla_action_codec.json

training:
  preview_before_rl: false
  rl:
    enabled: true
    algorithm: smolvla_residual_grpo_reverse_frontier
    script_path: ../../rl_vla_bootstrapping/policy/smolvla_grpo_finetune_cdpr.py
    launcher: torchrun
    launcher_args:
      standalone: true
      nproc_per_node: 1
    args:
      resume_checkpoint: /root/repo/RL_VLA_Bootstrapping/runs/cdpr_smolvla_stage3_object_dense_complex_resume_step_5000000_to_10000000_20260710_193100/rl/step_6700000
      max_train_steps: 10000000
      max_env_steps: 128
      num_envs_per_rank: 4
      chunk_size: 8
      replan_every: 1
      image_size: 256
      state_dim: 6
      include_wrist: true
      include_aux_camera: true
      mixed_precision: bf16
      smolvla_action_normalization: tanh
      hidden_dim: 1024
      residual_scale: 0.30
      learning_rate: 2.0e-4
      adam_eps: 1.0e-5
      weight_decay: 0.0
      init_log_std: -1.2
      min_log_std: -5.0
      max_log_std: 0.5
      clip_range: 0.20
      entropy_coef: 0.0
      action_l2: 0.0
      max_grad_norm: 1.0
      grpo_group_size: 4
      grpo_group_selection: uniform
      grpo_normalize_group_advantage: true
      grpo_clip_advantage_abs: 6.0
      rollout_steps: 2048
      ppo_epochs: 2
      batch_size: 4096
      minibatch_size: 4096
      microbatch_size: 2048
      complex_training_approach: reverse_frontier
      reverse_frontier_promotion_success: 0.80
      reverse_frontier_demotion_success: -1.0
      reverse_frontier_validation_episodes: 50
      reverse_frontier_min_train_updates: 1
      reverse_frontier_sample_probability: 0.80
      reverse_frontier_rehearsal_probability: 0.20
      action_step_xyz: 0.015
      action_step_yaw: 0.08
      action_step_gripper: 0.05
      hold_steps: 6
      lock_non_commanded_axes: false
      randomize_ee_start: true
      ee_start_x_bounds: [-0.20, 0.20]
      ee_start_y_bounds: [-0.20, 0.20]
      ee_start_z: 0.40
      randomize_ee_yaw: true
      ee_yaw_bounds: [-3.141592653589793, 3.141592653589793]
      save_every_steps: 100000
      log_every_steps: 250
      status_every_steps: 500
      metrics_window_episodes: 100
      validation_every_steps: 50000
      validation_episodes_per_instruction: 50
      comparison_validation_episodes_per_instruction: 20
      validation_seed: 1000000
      validation_video_count: 4
      validation_video_fps: 10.0
      mixed_curriculum_enabled: false
      progress_refresh_seconds: 10.0
      progress: true
      progress_only: true
      distributed: true
      distributed_backend: nccl
      wrapper_cleanup: false
      use_wrapper_cache: true
      reuse_existing_wrapper_variants: true
      capture_frames: false
      device: cuda
  sft:
    enabled: false

evaluation:
  benchmarks: []
