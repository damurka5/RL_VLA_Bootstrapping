      move_left,
      move_right,
      move_top,
      move_bottom,
      move_up,
      move_down,
      move_to_object,
    ]
  target_objects:
    [
      ycb_apple,
      ycb_pear,
      ycb_peach,
      ycb_b_cups,
      ycb_baseball,
    ]
  reward:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_reward
  success_predicate:
    file: ../../robots/cdpr/cdpr_dataset/rl_instruction_tasks.py
    function: compute_instruction_validation_success
  metadata:
    zero_demo_first: true
    instruction_sampling: uniform_cycle
    reward_mode: dense
    target_object_pool:
