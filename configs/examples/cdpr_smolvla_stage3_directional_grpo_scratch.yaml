project:
  name: cdpr_smolvla_stage3_directional_grpo_scratch
  output_root: ../../runs
  python_executable: python3

repos:
  dataset_repo: ../../robots/cdpr
  embodiment_repo: ../../robots/cdpr

remote:
  conda_env_file: null
  env_vars:
    MUJOCO_GL: egl
    PYOPENGL_PLATFORM: egl
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128
    TOKENIZERS_PARALLELISM: "false"
    RLVLA_CDPR_OFFSCREEN_SAMPLES: "1"
    RLVLA_CDPR_COMPILED_MODEL_CACHE: "true"
    RLVLA_CDPR_COMPILED_MODEL_CACHE_MAX_SIZE: "16"
    RLVLA_CDPR_QUIET: "true"
    RLVLA_CDPR_WRAPPER_LOG: "false"
  notes:
    - Stage-3 scratch SmolVLA GRPO run for direct directional movement plus move-to-object.
    - The instruction set is limited to move left/right/forward/backward/up/down and move to <obj>.
    - Internal move_top and move_bottom emit the language strings "move forward" and "move backward".
    - The pretrained SmolVLA prior remains frozen; GRPO trains only the residual/readout head and log-std parameters.
    - This run intentionally has no TD3 critics, replay buffer, gripper, push, carry, or placement instructions.

assets:
  bundles:
    - name: ycb
      kind: asset
      source_path: ../../../../repo/CDPR-Dataset/cdpr_dataset/external_assets/ycb_dataset/ycb
      target_path: ../../assets/externals/ycb
      required: true
      description: YCB object meshes and MJCFs used by CDPR randomized scenes.
    - name: libero
      kind: asset
      source_path: ../../../../repo/LIBERO/libero/libero/assets
      target_path: ../../assets/externals/libero
      required: true
      description: LIBERO scene XMLs, textures, and scanned/stable object assets.
    - name: desk_textures_cache
      kind: asset
      source_path: ../../../../repo/CDPR-Dataset/cdpr_dataset/wrappers/_desk_textures
      target_path: ../../assets/externals/desk_textures_cache
      required: false
      description: Optional CDPR desk texture cache.

embodiment:
  name: cdpr_5dof
  kind: mujoco
  robot_root: ../../robots/cdpr/cdpr_mujoco
  xml_path: ../../robots/cdpr/cdpr_mujoco/cdpr.xml
  dof: 5
  extra_python_paths:
    - ../../robots/cdpr
  cameras:
    overview: overview
    wrist: ee_camera
  controller:
    file: ../../robots/cdpr/cdpr_mujoco/headless_cdpr_egl.py
    class_name: HeadlessCDPRSimulation
    init_kwargs:
      output_dir: "{run_dir}"
    method_map:
      initialize: initialize
      step: run_simulation_step
      cleanup: cleanup
      capture_frame: capture_frame
    frame_buffers:
      overview: overview_frames
      wrist: ee_camera_frames
    camera_handles:
      overview: overview_cam
      wrist: ee_cam
    preview_steps: 1
  action_adapter:
    common_action_keys: [x, y, z, yaw, gripper]
    controller_scales:
      x: 0.015
      y: 0.015
      z: 0.015
      yaw: 0.08
      gripper: 0.05
    controller_limits:
      x: [-0.8, 0.8]
      y: [-0.8, 0.8]
      z: [0.08, 1.2]
      yaw: [-3.141592653589793, 3.141592653589793]
      gripper: [0.0, 1.0]
    open_gripper_threshold: -0.2
    close_gripper_threshold: 0.2

