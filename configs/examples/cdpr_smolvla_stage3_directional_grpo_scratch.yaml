    move_to_object_xy_window_low: 0.10
    move_to_object_xy_window_high: 0.15
    move_to_object_validation_distance_min: 0.10
    move_to_object_validation_distance_threshold: 0.15
    move_to_object_excess_distance_penalty_weight: 1.0
    move_to_object_too_close_penalty_weight: 0.25
    move_to_object_success_bonus: 0.0
    move_to_object_require_z_window: false
