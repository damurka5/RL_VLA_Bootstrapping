    goal_height_above_table: 0.10
    lateral_goal_offset: 0.40
    vertical_goal_offset: 0.10
    distance_reward_scale: 0.40
    distance_reward_weight: 1.0
    distance_reward_exponent: 2.0
    success_distance: 0.02
    success_bonus: 0.0
    move_to_object_single_object_scene: true
